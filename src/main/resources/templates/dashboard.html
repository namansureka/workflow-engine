<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Workflow Engine · Live</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base: #09090b;
            --bg-card: rgba(24, 24, 27, 0.4);
            --border-light: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.1);

            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --text-muted: #71717a;

            --accent: #3b82f6;

            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.1);
            --success-border: rgba(52, 211, 153, 0.2);

            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.1);
            --error-border: rgba(248, 113, 113, 0.2);

            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.1);
            --warning-border: rgba(251, 191, 36, 0.2);

            --info: #60a5fa;
            --info-bg: rgba(96, 165, 250, 0.1);
            --info-border: rgba(96, 165, 250, 0.2);

            --pending: #a1a1aa;
            --pending-bg: rgba(161, 161, 170, 0.1);
            --pending-border: rgba(161, 161, 170, 0.2);

            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.05), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(52, 211, 153, 0.03), transparent 40%);
            color: var(--text-main);
            font-family: var(--font);
            font-size: 13px;
            line-height: 1.5;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(251, 191, 36, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--warning-border);
            padding: 10px 24px;
            font-size: 13px; font-weight: 500; color: var(--warning);
            display: flex; align-items: center; gap: 10px; justify-content: center;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #banner.show { transform: translateY(0); }
        #banner .spin {
            width: 14px; height: 14px;
            border: 2px solid var(--warning-border);
            border-top-color: var(--warning);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .shell { display: flex; flex-direction: column; height: 100vh; }

        header {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(9, 9, 11, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .brand {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 500;
        }
        .brand .slash { color: var(--text-muted); font-weight: 400; }
        .brand .proj { color: var(--text-main); font-weight: 600; }
        .brand .live-chip {
            margin-left: 8px; font-size: 11px; font-weight: 600;
            letter-spacing: 0.5px; text-transform: uppercase;
            color: var(--success);
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            padding: 4px 10px; border-radius: 9999px;
            display: flex; align-items: center; gap: 6px;
        }
        .brand .live-chip::before {
            content: ''; width: 6px; height: 6px;
            background: var(--success); border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: live-pulse 2s ease-in-out infinite;
        }
        @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .header-right { display: flex; align-items: center; gap: 24px; }

        .event-counter { font-size: 13px; color: var(--text-dim); }
        .event-counter span { color: var(--text-main); font-weight: 600; font-variant-numeric: tabular-nums; }

        .conn-status {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--text-dim); font-weight: 500;
            padding: 6px 14px; border-radius: 9999px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            transition: all 0.3s;
        }
        .conn-status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-muted); transition: all 0.3s;
        }
        .conn-status.ok .dot { background: var(--success); box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
        .conn-status.err .dot { background: var(--error); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
        .conn-status.ok #conn-label { color: var(--text-main); }
        .conn-status.err #conn-label { color: var(--error); }

        .table-outer {
            flex: 1;
            margin: 32px auto;
            width: calc(100% - 64px);
            max-width: 1400px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border-hover) transparent;
        }
        .table-outer::-webkit-scrollbar { width: 6px; }
        .table-outer::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }
        colgroup col:nth-child(1) { width: 18%; }
        colgroup col:nth-child(2) { width: 22%; }
        colgroup col:nth-child(3) { width: 30%; }
        colgroup col:nth-child(4) { width: 16%; }
        colgroup col:nth-child(5) { width: 14%; }

        thead { position: sticky; top: 0; z-index: 5; }
        thead::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            z-index: -1;
        }

        th {
            padding: 16px 24px; text-align: left;
            font-size: 12px; font-weight: 500;
            color: var(--text-dim);
        }

        tbody tr {
            animation: slide-up 0.4s ease-out forwards;
            transition: background-color 0.2s;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        tbody td:first-child { position: relative; }
        tbody td:first-child::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
            background: transparent; transition: background 0.2s; z-index: 2;
        }
        tr.s-COMPLETED:hover td:first-child::before { background: var(--success); }
        tr.s-FAILED:hover td:first-child::before { background: var(--error); }
        tr.s-WAITING_RETRY:hover td:first-child::before { background: var(--warning); }
        tr.s-RUNNING td:first-child::before { background: var(--info); box-shadow: 0 0 12px var(--info); }
        tr.s-PENDING:hover td:first-child::before { background: var(--pending); }

        td {
            padding: 16px 24px; vertical-align: middle;
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        tbody tr:last-child td { border-bottom: none; }

        .cell-id { font-weight: 500; color: var(--text-dim); font-family: monospace; font-size: 12px; }
        .cell-wf { color: var(--text-main); font-weight: 500; }
        .cell-step { color: var(--text-dim); }
        .cell-ts { color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 4px 10px; border-radius: 9999px;
            font-size: 11px; font-weight: 500;
            letter-spacing: 0.3px; text-transform: capitalize;
            border: 1px solid transparent;
        }
        .badge .b-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .b-COMPLETED { color: var(--success); background: var(--success-bg); border-color: var(--success-border); }
        .b-FAILED { color: var(--error); background: var(--error-bg); border-color: var(--error-border); }
        .b-WAITING_RETRY { color: var(--warning); background: var(--warning-bg); border-color: var(--warning-border); }
        .b-RUNNING { color: var(--info); background: var(--info-bg); border-color: var(--info-border); }
        .b-RUNNING .b-dot {
            box-shadow: 0 0 8px var(--info);
            animation: glow-pulse 2s infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
        .b-PENDING { color: var(--text-main); background: var(--pending-bg); border-color: var(--pending-border); }

        .tooltip {
            position: fixed; z-index: 1000;
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-light);
            border-radius: 8px; padding: 16px;
            font-size: 12px; color: var(--text-main);
            pointer-events: none; opacity: 0; transform: translateY(4px);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out; min-width: 280px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        .tooltip.visible { opacity: 1; transform: translateY(0); }
        .tooltip .tl-row { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 8px; }
        .tooltip .tl-row:last-child { margin-bottom: 0; }
        .tooltip .tl-key { color: var(--text-muted); }
        .tooltip .tl-val { color: var(--text-main); font-weight: 500; }

        #empty-row td { text-align: center; padding: 120px 20px; border: none; }
        .empty-msg { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .empty-msg svg { opacity: 0.4; width: 32px; height: 32px; color: var(--text-muted); }
        .empty-msg p { font-size: 14px; color: var(--text-dim); font-weight: 500; }

        footer {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px; background: rgba(9, 9, 11, 0.6);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-light);
        }
        .legend { display: flex; gap: 24px; flex-wrap: wrap; }
        .leg {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-dim); font-weight: 500;
        }
        .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

        .footer-right { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    </style>
</head>
<body>

<div id="banner">
    <div class="spin"></div>
    <span>Connection lost — reconnecting…</span>
</div>

<div class="shell">

    <header>
        <div class="brand">
            <span>Workflow</span>
            <span class="slash">/</span>
            <span class="proj">Engine</span>
            <span class="live-chip">Live</span>
        </div>
        <div class="header-right">
            <div class="event-counter">Events: <span id="count">0</span></div>
            <div class="conn-status" id="conn-status">
                <div class="dot"></div>
                <span id="conn-label">connecting</span>
            </div>
        </div>
    </header>

    <div class="table-outer">
        <table>
            <colgroup>
                <col/><col/><col/><col/><col/>
            </colgroup>
            <thead>
            <tr>
                <th>Execution ID</th>
                <th>Workflow</th>
                <th>Current Step</th>
                <th>Status</th>
                <th style="text-align:right">Timestamp</th>
            </tr>
            </thead>
            <tbody id="exec-body">
            <tr id="empty-row">
                <td colspan="5">
                    <div class="empty-msg">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                        <p>Waiting for execution events…</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <div class="legend">
            <div class="leg"><div class="leg-dot" style="background:var(--success)"></div>Completed</div>
            <div class="leg"><div class="leg-dot" style="background:var(--error)"></div>Failed</div>
            <div class="leg"><div class="leg-dot" style="background:var(--warning)"></div>Waiting Retry</div>
            <div class="leg"><div class="leg-dot" style="background:var(--info)"></div>Running</div>
            <div class="leg"><div class="leg-dot" style="background:var(--pending)"></div>Pending</div>
        </div>
        <div class="footer-right">ws: /ws/dashboard → /topic/executions</div>
    </footer>

</div>

<script>
    /* ── utils ── */
    function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function relativeTime(raw) {
        try {
            const d   = (typeof raw === 'number') ? new Date(raw) : new Date(raw);
            const sec = Math.round((Date.now() - d) / 1000);
            if (isNaN(sec))          return raw;
            if (sec < 5)             return 'just now';
            if (sec < 60)            return `${sec}s ago`;
            if (sec < 3600)          return `${Math.floor(sec/60)}m ago`;
            if (sec < 86400)         return `${Math.floor(sec/3600)}h ago`;
            return `${Math.floor(sec/86400)}d ago`;
        } catch { return raw; }
    }

    function absTime(raw) {
        try {
            const d = new Date(raw);
            return isNaN(d) ? raw : d.toLocaleString('en-IN', {
                day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
            });
        } catch { return raw; }
    }

    /* ── state ── */
    let rowCount  = 0;
    let rowData   = new WeakMap(); // tr → raw data
    let relTimers = [];            // list of {td, rawTs} to tick

    const banner    = document.getElementById('banner');
    const connEl    = document.getElementById('conn-status');
    const connLabel = document.getElementById('conn-label');
    const countEl   = document.getElementById('count');
    const body      = document.getElementById('exec-body');
    let   emptyRow  = document.getElementById('empty-row');

    /* ── relative time ticker ── */
    function startTicker() {
        setInterval(() => {
            relTimers.forEach(({ td, rawTs }) => {
                td.textContent = relativeTime(rawTs);
            });
        }, 10_000);
    }

    /* ── tooltip ── */
    let activeTooltip = null;

    function showTooltip(tr, data) {
        hideTooltip();
        const tip = document.createElement('div');
        tip.className = 'tooltip';
        tip.innerHTML = `
    <div class="tl-row"><span class="tl-key">executionId</span><span class="tl-val">${esc(data.executionId)}</span></div>
    <div class="tl-row"><span class="tl-key">workflowName</span><span class="tl-val">${esc(data.workflowName)}</span></div>
    <div class="tl-row"><span class="tl-key">currentStep</span><span class="tl-val">${esc(data.currentStep)}</span></div>
    <div class="tl-row"><span class="tl-key">status</span><span class="tl-val">${esc(data.status)}</span></div>
    <div class="tl-row"><span class="tl-key">timestamp</span><span class="tl-val">${absTime(data.timestamp)}</span></div>
  `;
        document.body.appendChild(tip);
        
        const rect = tr.getBoundingClientRect();
        tip.style.left = (rect.left + 24) + 'px';
        
        requestAnimationFrame(() => {
            const tipHeight = tip.offsetHeight;
            let top = rect.bottom + 8;
            if (top + tipHeight > window.innerHeight - 20) {
                top = rect.top - tipHeight - 8;
            }
            tip.style.top = top + 'px';
            tip.classList.add('visible');
        });
        activeTooltip = tip;
    }

    function hideTooltip() {
        if (activeTooltip) { activeTooltip.remove(); activeTooltip = null; }
    }

    /* ── add row ── */
    function addRow(data) {
        if (emptyRow) { emptyRow.remove(); emptyRow = null; }

        const status  = (data.status || 'PENDING').trim().toUpperCase();
        const label   = status.replace(/_/g, ' ');
        const rawTs   = data.timestamp;

        const tr = document.createElement('tr');
        tr.className = `s-${status}`;

        const tsTd = document.createElement('td');
        tsTd.className = 'cell-ts';
        tsTd.textContent = relativeTime(rawTs);
        relTimers.push({ td: tsTd, rawTs });

        tr.innerHTML = `
    <td class="cell-id">${esc(data.executionId)}</td>
    <td class="cell-wf">${esc(data.workflowName)}</td>
    <td class="cell-step">${esc(data.currentStep)}</td>
    <td><span class="badge b-${status}"><span class="b-dot"></span>${esc(label)}</span></td>
  `;
        tr.appendChild(tsTd);

        rowData.set(tr, data);

        tr.addEventListener('mouseenter', () => showTooltip(tr, rowData.get(tr)));
        tr.addEventListener('mouseleave', hideTooltip);

        body.insertBefore(tr, body.firstChild);
        rowCount++;
        countEl.textContent = rowCount;
    }

    /* ── connect ── */
    function setStatus(state) {
        // state: 'connecting' | 'connected' | 'disconnected'
        connEl.className = 'conn-status' + (state === 'connected' ? ' ok' : state === 'disconnected' ? ' err' : '');
        connLabel.textContent = state;
        banner.classList.toggle('show', state === 'disconnected');
    }

    function connect() {
        setStatus('connecting');
        const socket = new SockJS('/ws/dashboard');
        const client = Stomp.over(socket);
        client.debug  = null;

        client.connect({}, () => {
            setStatus('connected');

            client.subscribe('/topic/executions', msg => {
                try { addRow(JSON.parse(msg.body)); }
                catch(e) { console.warn('[ws] bad payload', msg.body); }
            });

        }, () => {
            setStatus('disconnected');
            setTimeout(connect, 5000);
        });

        socket.onclose = () => {
            setStatus('disconnected');
        };
    }

    startTicker();
    connect();
    document.querySelector('.table-outer').addEventListener('scroll', hideTooltip);
</script>
</body>
</html>
